<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Violations{% endblock %} · {{ HOA_NAME }}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2430;--mut:#667085;--line:#e3e6eb;--acc:#1f5fbf;--bad:#b42318;--ok:#067647;--warn:#b54708}
@media(prefers-color-scheme:dark){:root{--bg:#12151a;--card:#1b2028;--ink:#e8ebf0;--mut:#98a2b3;--line:#2c333d;--acc:#6aa3ff;--bad:#ff8a80;--ok:#5fd39a;--warn:#f5b45a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
a{color:var(--acc)}header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header strong{margin-right:auto}main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
h1{font-size:1.4rem;margin:.2em 0 .6em}h2{font-size:1.05rem;margin:0 0 .5em}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:.8rem;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.stat{padding:10px;border:1px solid var(--line);border-radius:8px}.stat b{font-size:1.5rem;display:block}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;border:1px solid var(--line);color:var(--mut)}
.msg{padding:9px 12px;border-radius:8px;margin-bottom:10px;border:1px solid var(--line)}.msg.error{color:var(--bad)}.msg.success{color:var(--ok)}.msg.warning{color:var(--warn)}
input,select,textarea{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input[type=checkbox]{width:auto}label{display:block;font-weight:600;margin:8px 0 2px;font-size:.88rem}
button,.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}button.bad{background:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:200px}.mut{color:var(--mut)}.photos img{max-width:220px;border-radius:8px;border:1px solid var(--line);margin:0 8px 8px 0}
.late{color:var(--bad);font-weight:600}ul.tl{list-style:none;padding:0;margin:0}ul.tl li{padding:4px 0;border-bottom:1px solid var(--line)}
details summary{cursor:pointer;color:var(--acc)}
@media(max-width:600px){th{display:none}}
</style></head><body>
<header><strong>{{ HOA_NAME }}</strong>
{% if user.is_authenticated %}<a href="{% url 'dashboard' %}">Dashboard</a><a href="{% url 'violation_list' %}?status=open">Violations</a>
<a href="{% url 'board_queue' %}">Board queue</a><a href="{% url 'violation_create' %}">+ New</a><a href="{% url 'admin:index' %}">Owners/Types</a>
<form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button class="sec">Log out</button></form>{% endif %}</header>
<main>{% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
