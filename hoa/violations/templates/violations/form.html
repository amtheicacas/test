{% extends "violations/base.html" %}{% block content %}
<h1>New violation</h1>
<form class="card" method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}
<label>Photo(s) of the violation</label><input type="file" name="photos" accept="image/*" multiple>
<p class="mut">Leave "Issue immediately" checked to send right away, or uncheck it to save a draft and review first. Owner or violation type missing? Add them under <a href="{% url 'admin:index' %}">Owners/Types</a>.</p>
<button>Save</button></form>{% endblock %}
