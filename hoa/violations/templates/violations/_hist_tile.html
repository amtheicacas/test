<button type="button" class="stat tile" data-key="{{ key }}" aria-expanded="false"><b>{% if dollar %}${% endif %}{{ big }}{{ sfx }}</b><span class="mut">{{ label }}</span>
<span class="tip">{% if cases %}{% for o in cases|slice:":5" %}<span style="display:block">#{{ o.pk }} {{ o.vtype.name|truncatechars:34 }} <span class="mut">· {{ o.get_status_display|truncatechars:28 }}{% if o.fine_amount %} · ${{ o.fine_amount }}{% endif %}</span></span>{% endfor %}{% if cases|length > 5 %}<span class="mut">+ {{ cases|length|add:"-5" }} more, click to see all</span>{% else %}<span class="mut">Click for details</span>{% endif %}{% else %}{{ empty }}{% endif %}</span></button>
