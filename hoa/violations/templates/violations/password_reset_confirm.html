{% extends "violations/base.html" %}{% block title %}New password{% endblock %}{% block content %}
<div class="card" style="max-width:440px;margin:40px auto">{% if validlink %}<h1>Choose a new password</h1><form method="post">{% csrf_token %}{{ form.as_p }}<button>Save password</button></form>
{% else %}<h1>This link has expired</h1><p>Request a new reset link from the <a href="{% url 'password_reset' %}">reset page</a>.</p>{% endif %}</div>{% endblock %}
