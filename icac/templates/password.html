{% extends 'base.html' %}{% from 'macros.html' import csrf_field  with context %}{% block body %}
<form method="post" class="panel narrow"><h1>Change password</h1>{{ csrf_field() }}
{% if user.must_change_password %}<p class="muted">Please set a new password to continue.</p>{% endif %}
<label>Current password<input type="password" name="current" required></label>
<label>New password (10+ characters)<input type="password" name="new" minlength="10" required></label>
<button class="btn">Update</button></form>{% endblock %}
